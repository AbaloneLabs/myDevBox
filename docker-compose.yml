services:
  # PostgreSQL 데이터베이스 (pgvector 포함)
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mydevbox
      POSTGRES_PASSWORD: mydevbox
      POSTGRES_DB: mydevbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydevbox"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 백엔드 API 서버 (Fastify)
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://mydevbox:mydevbox@db:5432/mydevbox
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-mydevbox-dev-encryption-key-change-in-prod}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 프론트엔드 웹 서버 (정적 서빙)
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  pgdata:
