services:
  # PostgreSQL 데이터베이스 (pgvector 포함)
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mydevbox
      POSTGRES_PASSWORD: mydevbox
      POSTGRES_DB: mydevbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydevbox"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # MyDevBox 서버 (API / WebSocket / 정적 프론트엔드를 단일 origin으로 서빙)
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://mydevbox:mydevbox@db:5432/mydevbox
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-mydevbox-dev-encryption-key-change-in-prod}
      # 외부 git 저장소 자동 동기화 주기 (기본 5분)
      - MYDEVBOX_GIT_SYNC_INTERVAL_MS=${MYDEVBOX_GIT_SYNC_INTERVAL_MS:-300000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 프로젝트 소스(~/repos)와 크로스프로젝트 마스터 위키 영속화
      - repos:/root/repos
      - masterwiki:/root/.mydevbox
    restart: unless-stopped

volumes:
  pgdata:
  repos:
  masterwiki:
